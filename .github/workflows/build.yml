name: RKSU Kernel Build - OnePlus 7T

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_REPO: https://github.com/Evolution-X-Devices/kernel_oneplus_sm8150.git
      KERNEL_COMMIT: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
      KSU_BRANCH: main
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates \
            clang clang-14 lld llvm \
            cpio curl flex git libelf-dev \
            libssl-dev make pahole python3 \
            rsync unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Checkout kernel source
        run: |
          git clone "$KERNEL_REPO" kernel
          cd kernel
          git checkout "$KERNEL_COMMIT"
          git rev-parse HEAD

      - name: Integrate RKSU
        working-directory: kernel
        run: |
          set -e

          curl -fLSs \
            "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh "$KSU_BRANCH"

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: RKSU directory was not created."
            exit 1
          fi

          echo "RKSU integration directory:"
          ls drivers/kernelsu

      - name: Download manual-hook patch
        run: |
          set -e

          curl -fLSs \
            "https://raw.githubusercontent.com/rksuorg/kernel_patches/master/manual_hook/kernel-4.14.patch" \
            -o "$RUNNER_TEMP/manual_hook.patch"

          test -s "$RUNNER_TEMP/manual_hook.patch"
          head -n 5 "$RUNNER_TEMP/manual_hook.patch"

      - name: Check and apply manual-hook patch
        working-directory: kernel
        run: |
          set -e

          git apply --stat "$RUNNER_TEMP/manual_hook.patch"
          git apply --check "$RUNNER_TEMP/manual_hook.patch"
          git apply "$RUNNER_TEMP/manual_hook.patch"

          echo "Manual-hook patch applied."

      - name: Verify hook declarations
        working-directory: kernel
        run: |
          set -e

          grep -n 'ksu_input_hook' drivers/input/input.c
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c
          grep -n 'ksu_handle_vfs_read' fs/read_write.c
          grep -n 'ksu_handle_stat' fs/stat.c
          grep -n 'ksu_handle_sys_reboot' kernel/reboot.c

      - name: Compute extra include paths (Clang fix, all MSM dirs)
        working-directory: kernel
        run: |
          set -e

          roots="drivers/platform/msm drivers/media/platform/msm drivers/soc/qcom drivers/misc drivers/input drivers/char drivers/power"

          {
            # Parent dir of every subdir (fixes "subdir/x.h includes ../x.h" cases, e.g. ipa_v3/dump)
            for d in $(find $roots -mindepth 1 -type d 2>/dev/null); do
              p=$(dirname "$d")
              if ls "$p"/*.h >/dev/null 2>&1; then echo "$PWD/$p"; fi
            done
            # Dirs holding tracepoint headers (fixes cam_trace.h)
            find $roots -name '*_trace.h' -printf '%h\n' 2>/dev/null | sed "s|^|$PWD/|"
          } | sort -u > /tmp/inc_dirs.txt

          wc -l /tmp/inc_dirs.txt
          echo "EXTRA_INC=$(sed 's/^/-I/' /tmp/inc_dirs.txt | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/sm8150-perf_defconfig

          # Ensure RKSU is enabled.
          if ! grep -rqE '^[[:space:]]*config KSU([[:space:]]|$)' \
            drivers/kernelsu --include='Kconfig*'; then
            echo "ERROR: RKSU Kconfig entry not found."
            exit 1
          fi

          scripts/config --enable KSU

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          if ! grep -qx 'CONFIG_KSU=y' .config; then
            echo "ERROR: CONFIG_KSU=y is not enabled."
            exit 1
          fi

          echo "RKSU configuration enabled."
          grep -E '^CONFIG_KSU' .config || true

      - name: Build kernel Image
        working-directory: kernel
        run: |
          set -o pipefail

          make -k -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang-14 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error $EXTRA_INC" \
            Image 2>&1 | tee build.log

      - name: Summarize all errors
        if: always()
        working-directory: kernel
        run: |
          grep -nE "fatal error|error:|undefined reference" build.log | sort -u | head -80 || true

      - name: Verify Image
        if: always()
        working-directory: kernel
        run: |
          if [ -f arch/arm64/boot/Image ]; then
            ls -lh arch/arm64/boot/Image
            sha256sum arch/arm64/boot/Image
            file arch/arm64/boot/Image
          else
            echo "Image not found. Check the build log."
          fi

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RKSU-OnePlus-7T-Image
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RKSU-build-log
          path: kernel/build.log
          if-no-files-found: ignore