name: KernelSU Next Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync wget

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy
          test -d drivers/kernelsu

      - name: Configure and inspect hook definition
        working-directory: kernel
        run: |
          echo "=== Kernel version ==="
          head -n 6 Makefile

          echo "=== Hook definition ==="
          sed -n '45,75p' drivers/kernelsu/Kconfig

          echo "=== Hook dependencies ==="
          grep -n -A 8 -B 3 'KSU_KPROBES_HOOK' \
            drivers/kernelsu/Kconfig || true

          echo "=== Load default configuration ==="
          make ARCH=arm64 vendor/sm8150-perf_defconfig

          echo "=== Enable options ==="
          scripts/config --enable MODULES
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --enable KSU
          scripts/config --enable KSU_KPROBES_HOOK

          make ARCH=arm64 olddefconfig

          echo "=== Final configuration ==="
          grep -E \
            'CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KSU|KSU_KPROBES_HOOK)=' \
            .config || true

          echo "=== Hook symbol in source and config ==="
          grep -n 'KSU_KPROBES_HOOK' \
            .config drivers/kernelsu/Kconfig || true

          echo "=== Source commit ==="
          git rev-parse HEAD