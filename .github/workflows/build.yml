name: RKSU (rsuntk KernelSU) Non-GKI Build - OnePlus 7T

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Base defconfig under arch/arm64/configs"
        required: false
        default: "vendor/sm8150-perf_defconfig"
      fragments:
        description: "Extra config fragments (space separated)"
        required: false
        default: "vendor/oplus.config"

permissions:
  contents: read

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KSU_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout OnePlus 7T kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Integrate RKSU
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          if ! git ls-remote --exit-code \
            https://github.com/rsuntk/KernelSU.git \
            "refs/heads/${KSU_BRANCH}" "refs/tags/${KSU_BRANCH}"; then
            echo "ERROR: ref '${KSU_BRANCH}' not found on rsuntk/KernelSU."
            exit 1
          fi

          curl -LSs \
            "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh
          test -s /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "${KSU_BRANCH}"

          test -e drivers/kernelsu
          real="$(readlink -f drivers/kernelsu)"
          echo "drivers/kernelsu -> $real"

      - name: Inject KernelSU Manual Hooks (Auto-Patcher)
        working-directory: kernel
        run: |
          python3 - <<'EOF'
          import os, re

          # Hook definitions for Linux 4.14
          hooks = {
              "fs/exec.c": [
                  (r"(static int do_execveat_common\(int fd, struct filename \*filename,.*?\n\{)", 
                   r"\1\n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *flags, int *hooked);\n\tint hooked = 0;\n\tksu_handle_execveat(&fd, &filename, &flags, &hooked);\n\tif (hooked)\n\t\treturn hooked;\n")
              ],
              "fs/open.c": [
                  (r"(long do_faccessat\(int dfd, const char __user \*filename, int mode\)\n\{)", 
                   r"\1\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_ptr, int *mode, int *hooked);\n\tint hooked = 0;\n\tksu_handle_faccessat(&dfd, &filename, &mode, &hooked);\n\tif (hooked)\n\t\treturn hooked;\n")
              ],
              "fs/read_write.c": [
                  (r"(ssize_t vfs_read\(struct file \*file, char __user \*buf, size_t count, loff_t \*pos\)\n\{)", 
                   r"\1\n\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n"),
                  (r"(ssize_t vfs_write\(struct file \*file, const char __user \*buf, size_t count, loff_t \*pos\)\n\{)", 
                   r"\1\n\textern int ksu_handle_vfs_write(struct file **file_ptr, const char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n\tksu_handle_vfs_write(&file, &buf, &count, &pos);\n")
              ],
              "fs/stat.c": [
                  (r"(int vfs_statx\(int dfd, const char __user \*filename, int flags,\n\t\t  struct kstat \*stat, u32 request_mask\)\n\{)", 
                   r"\1\n\textern int ksu_handle_stat(int *dfd, const char __user **filename_ptr, int *flags);\n\tksu_handle_stat(&dfd, &filename, &flags);\n")
              ],
              "drivers/input/input.c": [
                  (r"(static void input_handle_event\(struct input_dev \*dev,\n\t\t\t\t unsigned int type, unsigned int code, int value\)\n\{)", 
                   r"\1\n\textern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n\tksu_handle_input_handle_event(&type, &code, &value);\n")
              ]
          }

          for filepath, patches in hooks.items():
              if not os.path.exists(filepath):
                  print(f"File not found: {filepath}")
                  continue
              
              with open(filepath, 'r') as f:
                  content = f.read()
              
              for pattern, replacement in patches:
                  if "ksu_handle_" not in content:
                      content = re.sub(pattern, replacement, content, count=1, flags=re.DOTALL)
              
              with open(filepath, 'w') as f:
                  f.write(content)
              print(f"Patched {filepath}")
          EOF

      - name: Verify KernelSU hook integration (Strict Check)
        working-directory: kernel
        shell: bash
        run: |
          set +e
          missing_hooks=0
          echo "=== Verifying Manual Hooks ==="
          for f in fs/exec.c fs/open.c fs/read_write.c fs/stat.c drivers/input/input.c; do
            if grep -q 'ksu_handle_' "$f" 2>/dev/null; then
              echo "HOOKED:  $f"
            else
              echo "MISSING: $f"
              missing_hooks=$((missing_hooks + 1))
            fi
          done
          
          if [ "$missing_hooks" -gt 0 ]; then
            echo "ERROR: $missing_hooks required hook files are missing manual ksu_handle_ entries!"
            echo "KernelSU will not function without manual hooks when KPROBES are disabled."
            exit 1
          fi
          echo "All hooks successfully verified!"

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        env:
          BASE_DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_FRAGMENTS: ${{ inputs.fragments }}
        run: |
          set -euxo pipefail

          MAKE_ARGS="ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          base="${BASE_DEFCONFIG:-vendor/sm8150-perf_defconfig}"
          frags="${EXTRA_FRAGMENTS-vendor/oplus.config}"

          make $MAKE_ARGS "$base"

          for f in $frags; do
            ARCH=arm64 scripts/kconfig/merge_config.sh -m .config "arch/arm64/configs/$f"
          done

          scripts/config --enable KSU
          scripts/config --enable KSU_MANUAL_HOOK
          scripts/config --disable KPROBES
          scripts/config --disable KPROBE_EVENTS

          make $MAKE_ARGS olddefconfig

          grep -qx 'CONFIG_KSU=y' .config || { echo "ERROR: CONFIG_KSU not y"; exit 1; }
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' .config || { echo "ERROR: CONFIG_KSU_MANUAL_HOOK not y"; exit 1; }

      - name: Fix trace header include paths
        working-directory: kernel
        shell: bash
        run: |
          set -uo pipefail

          patch_mk() {
            dir="$1"
            mk=""
            for cand in "$dir/Kbuild" "$dir/Makefile"; do
              if [ -f "$cand" ]; then mk="$cand"; break; fi
            done
            if [ -z "$mk" ]; then return; fi
            if grep -qF 'TRACEFIX' "$mk"; then return; fi
            printf '\n# TRACEFIX\nccflags-y += -I$(srctree)/$(src) -I$(src)\n' >> "$mk"
          }

          patch_mk drivers/media/platform/msm/camera/cam_utils
          while read -r hdr; do
            patch_mk "$(dirname "$hdr")"
          done < <(grep -rlE 'define[[:space:]]+TRACE_INCLUDE_PATH[[:space:]]+.' \
            --include='*.h' . 2>/dev/null || true)

      - name: Fix Oplus header include issues
        working-directory: kernel
        shell: bash
        run: |
          if [ -f drivers/power/oplus/charger_ic/oplus_da9313.c ]; then
            sed -i 's/#include <oplus_da9313.h>/#include "oplus_da9313.h"/g' drivers/power/oplus/charger_ic/oplus_da9313.c
          fi
          find drivers/power/oplus -name '*.c' -o -name '*.h' | xargs sed -i 's/#include <\(oplus_.*\.h\)>/#include "\1"/g' || true
          echo "Oplus header includes patched successfully."

      - name: Compile kernel Image
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image 2>&1 | tee ../kernel-build.log

      - name: Show first build error
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -f kernel-build.log ]; then
            grep -n -m1 -B 8 -A 15 -E 'fatal error:|error:|undefined reference|No such file' kernel-build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-build-log
          path: kernel-build.log
          retention-days: 7

      - name: Verify kernel Image contains KernelSU
        if: success()
        working-directory: kernel
        shell: bash
        run: |
          set -e
          test -s arch/arm64/boot/Image
          if grep -qai 'kernelsu' arch/arm64/boot/Image; then
            echo "KernelSU strings found in Image. Ready to flash!"
          else
            echo "ERROR: KernelSU strings missing from Image."
            exit 1
          fi

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-image-test
          path: kernel/arch/arm64/boot/Image
          retention-days: 7
