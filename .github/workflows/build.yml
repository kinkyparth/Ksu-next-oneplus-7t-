name: RKSU Non-GKI Build - OnePlus 7T

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Base defconfig"
        required: false
        default: "vendor/sm8150-perf_defconfig"
      fragments:
        description: "Config fragments"
        required: false
        default: "vendor/oplus.config"

permissions:
  contents: read

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KSU_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates \
            ccache clang curl flex git libelf-dev \
            libssl-dev lld llvm make pahole \
            python3 python-is-python3 unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Install RKSU
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh main
          test -e drivers/kernelsu
          grep -nE 'KSU|kernelsu' Makefile
          grep -nE 'KSU|kernelsu' Kconfig

      - name: Inspect RKSU hook integration points
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "=== RKSU handler definitions ==="
          sed -n '100,210p' drivers/kernelsu/feature/sucompat.c
          sed -n '400,440p' drivers/kernelsu/runtime/ksud.c
          sed -n '20,50p' drivers/kernelsu/runtime/ksud.h

          echo "=== exec implementation ==="
          sed -n '1700,1775p' fs/exec.c

          echo "=== open syscall candidates ==="
          grep -nE 'SYSCALL_DEFINE[0-9]+\(faccessat|do_faccessat' \
            fs/open.c || true

          echo "=== stat syscall candidates ==="
          grep -nE 'SYSCALL_DEFINE[0-9]+\(newfstatat|SYSCALL_DEFINE[0-9]+\(stat|SYSCALL_DEFINE[0-9]+\(lstat|vfs_fstatat|vfs_statx' \
            fs/stat.c || true
          sed -n '530,590p' fs/stat.c

          echo "=== read implementation ==="
          sed -n '400,465p' fs/read_write.c

          echo "=== existing kernel hook calls ==="
          grep -nE 'ksu_handle_(execveat|faccessat|stat|vfs_read)' \
            fs/exec.c fs/open.c fs/read_write.c fs/stat.c || true

      - name: Apply compatibility include fixes
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          find drivers/power/oplus -type f \
            \( -name '*.c' -o -name '*.h' \) -print0 |
          while IFS= read -r -d '' file; do
            sed -i -E \
              's/#include <(oplus_[^>]+)>/#include "\1"/g' \
              "$file"
          done

          if [ -f drivers/media/platform/msm/camera/cam_utils/Makefile ]; then
            grep -q 'cam_trace' \
              drivers/media/platform/msm/camera/cam_utils/Makefile || true
          fi

          grep -R -n 'cam_trace.h' \
            drivers/media/platform/msm/camera || true

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          FRAGMENTS: ${{ inputs.fragments }}
        run: |
          set -euo pipefail

          make O=out ARCH=arm64 \
            CC=clang LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          for fragment in $FRAGMENTS; do
            if [ -f "arch/arm64/configs/$fragment" ]; then
              scripts/kconfig/merge_config.sh -O out \
                out/.config "arch/arm64/configs/$fragment"
            else
              echo "Fragment not found: $fragment"
              exit 1
            fi
          done

          scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --disable KPROBES \
            --disable KPROBE_EVENTS

          make O=out ARCH=arm64 \
            CC=clang LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          grep -E '^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=|^CONFIG_KPROBES=|^CONFIG_KPROBE_EVENTS=' \
            out/.config || true

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config

      - name: Build kernel image
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          make O=out -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image 2>&1 | tee ../kernel-build.log

      - name: Verify build output
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

          echo "=== KernelSU objects ==="
          find out -type f \
            \( -iname '*kernelsu*.o' -o -path '*kernelsu*/*.o' \) \
            | head -100 || true

          echo "=== Hook calls in source ==="
          grep -nE 'ksu_handle_(execveat|faccessat|stat|vfs_read)' \
            fs/exec.c fs/open.c fs/read_write.c fs/stat.c || true

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-diagnostics
          path: |
            kernel-build.log
            kernel/drivers/kernelsu/feature/sucompat.c
            kernel/drivers/kernelsu/runtime/ksud.c
            kernel/drivers/kernelsu/runtime/ksud.h
            kernel/fs/exec.c
            kernel/fs/open.c
            kernel/fs/read_write.c
            kernel/fs/stat.c
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-image-test
          path: kernel/out/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7