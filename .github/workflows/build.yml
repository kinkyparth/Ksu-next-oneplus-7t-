name: KernelSU Next Compile Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: lineage-23.0
          path: kernel
          fetch-depth: 0

      - name: Check source and config
        working-directory: kernel
        run: |
          echo "Commit:"
          git rev-parse HEAD
          echo "Kernel version:"
          head -n 6 Makefile
          echo "Required config:"
          grep -E 'CONFIG_(EROFS_FS|KPROBES|KPROBE_EVENTS|MODULES)=' \
            arch/arm64/configs/vendor/sm8150-perf_defconfig || true
          echo "Build configuration:"
          cat build.config.aarch64