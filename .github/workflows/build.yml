name: KernelSU Next Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy
          test -d drivers/kernelsu

      - name: Configure kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 CC=clang LLVM=1 \
            vendor/sm8150-perf_defconfig

          scripts/config --enable MODULES
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --enable KSU

          make ARCH=arm64 CC=clang LLVM=1 olddefconfig

          echo "=== Kernel version ==="
          make ARCH=arm64 CC=clang LLVM=1 kernelversion

          echo "=== KernelSU configuration ==="
          grep -E 'CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KSU)=' \
            .config || true

      - name: Compile kernel
        working-directory: kernel
        run: |
          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image dtbs

      - name: Verify build outputs
        working-directory: kernel
        run: |
          echo "=== Kernel image ==="
          ls -lh arch/arm64/boot/Image

          echo "=== Device trees ==="
          find arch/arm64/boot/dts -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            | head -n 30

          sha256sum arch/arm64/boot/Image

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-build-test
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: error
          retention-days: 7