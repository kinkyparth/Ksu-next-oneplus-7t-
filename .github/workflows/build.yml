name: RKSU Non-GKI Build - OnePlus 7T

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Base defconfig under arch/arm64/configs"
        required: false
        default: "vendor/sm8150-perf_defconfig"
      fragments:
        description: "Extra config fragments (space separated)"
        required: false
        default: "vendor/oplus.config"

permissions:
  contents: read

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KSU_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Integrate RKSU
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail
          git ls-remote --exit-code \
            https://github.com/rsuntk/KernelSU.git \
            "refs/heads/${KSU_BRANCH}"
          curl -fLSs \
            "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh
          test -s /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "${KSU_BRANCH}"
          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          grep -q kernelsu drivers/Makefile
          grep -q kernelsu drivers/Kconfig
          readlink -f drivers/kernelsu
          grep -rhE '^config ' drivers/kernelsu/ --include=Kconfig

      - name: Apply RKSU manual hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          def replace_once(file, old, new):
              p = Path(file)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"PATCH ABORTED: {file}: expected one anchor, found {count}"
                  )
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "fs/exec.c",
              "static int do_execveat_common(int fd, struct filename *filename,",
              """#ifdef CONFIG_KSU
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                         void *argv, void *envp, int *flags);
          #endif

          static int do_execveat_common(int fd, struct filename *filename,"""
          )

          replace_once(
              "fs/exec.c",
              "\\tif (IS_ERR(filename))\\n\\t\\treturn PTR_ERR(filename);",
              """\\tif (IS_ERR(filename))
          \\t\\treturn PTR_ERR(filename);
          #ifdef CONFIG_KSU
          \\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          #endif"""
          )

          replace_once(
              "fs/read_write.c",
              "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)",
              """#ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_vfs_read(struct file **file_ptr,
                                         char __user **buf_ptr,
                                         size_t *count_ptr, loff_t **pos);
          #endif

          ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)"""
          )

          replace_once(
              "fs/read_write.c",
              """{
          \\tssize_t ret;

          \\tif (!(file->f_mode & FMODE_READ))""",
              """{
          \\tssize_t ret;

          #ifdef CONFIG_KSU
          \\tif (unlikely(ksu_vfs_read_hook))
          \\t\\tksu_handle_vfs_read(&file, &buf, &count, &pos);
          #endif

          \\tif (!(file->f_mode & FMODE_READ))"""
          )

          replace_once(
              "fs/stat.c",
              "int vfs_statx(int dfd, const char __user *filename, int flags,",
              """#ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd,
                                     const char __user **filename_user,
                                     int *flags);
          #endif

          int vfs_statx(int dfd, const char __user *filename, int flags,"""
          )

          replace_once(
              "fs/stat.c",
              """\\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;

          \\tif ((flags & ~(AT_SYMLINK_NOFOLLOW""",
              """\\tunsigned int lookup_flags = LOOKUP_FOLLOW | LOOKUP_AUTOMOUNT;

          #ifdef CONFIG_KSU
          \\tksu_handle_stat(&dfd, &filename, &flags);
          #endif
          \\tif ((flags & ~(AT_SYMLINK_NOFOLLOW"""
          )

          replace_once(
              "fs/open.c",
              "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
              """#ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd,
                                          const char __user **filename_user,
                                          int *mode, int *flags);
          #endif

          SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)"""
          )

          replace_once(
              "fs/open.c",
              """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          \\tconst struct cred *old_cred;""",
              """SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
          {
          \\tconst struct cred *old_cred;
          #ifdef CONFIG_KSU
          \\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif"""
          )

          print("RKSU hook patch applied.")
          PY

          grep -n 'ksu_handle_execveat(&fd' fs/exec.c
          grep -n 'ksu_handle_vfs_read(&file' fs/read_write.c
          grep -n 'ksu_handle_stat(&dfd' fs/stat.c
          grep -n 'ksu_handle_faccessat(&dfd' fs/open.c

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        env:
          BASE_DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_FRAGMENTS: ${{ inputs.fragments }}
        run: |
          set -euxo pipefail
          MAKE_ARGS="ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
          base="${BASE_DEFCONFIG:-vendor/sm8150-perf_defconfig}"
          frags="${EXTRA_FRAGMENTS:-vendor/oplus.config}"
          test -f "arch/arm64/configs/$base"
          make $MAKE_ARGS "$base"
          for f in $frags; do
            test -f "arch/arm64/configs/$f"
            ARCH=arm64 scripts/kconfig/merge_config.sh -m .config "arch/arm64/configs/$f"
          done
          grep -q 'config KSU_MANUAL_HOOK' drivers/kernelsu/Kconfig
          scripts/config --enable KSU
          scripts/config --enable KSU_MANUAL_HOOK
          scripts/config --disable KPROBES
          scripts/config --disable KPROBE_EVENTS
          make $MAKE_ARGS olddefconfig
          grep -qx 'CONFIG_KSU=y' .config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' .config
          if grep -qx 'CONFIG_KPROBES=y' .config; then
            echo "KPROBES unexpectedly enabled"
            exit 1
          fi

      - name: Fix trace header include paths
        working-directory: kernel
        shell: bash
        run: |
          set -uo pipefail
          patch_mk() {
            dir="$1"
            mk=""
            for cand in "$dir/Kbuild" "$dir/Makefile"; do
              if [ -f "$cand" ]; then mk="$cand"; break; fi
            done
            [ -n "$mk" ] || return 0
            grep -qF TRACEFIX "$mk" && return 0
            printf '\n# TRACEFIX\nccflags-y += -I$(srctree)/$(src) -I$(src)\n' >> "$mk"
          }
          patch_mk drivers/media/platform/msm/camera/cam_utils
          while read -r hdr; do
            patch_mk "$(dirname "$hdr")"
          done < <(grep -rlE 'define[[:space:]]+TRACE_INCLUDE_PATH[[:space:]]+.' \
            --include='*.h' . 2>/dev/null || true)

      - name: Fix Oplus header includes
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          find drivers/power/oplus \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 -r sed -i \
              's/#include <\(oplus_[^>]*\.h\)>/#include "\1"/g'
          echo "Oplus include patch completed."

      - name: Compile kernel Image
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image 2>&1 | tee ../kernel-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify kernel Image
        if: success()
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail
          test -s arch/arm64/boot/Image
          ls -lh arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image
          count="$(find -L drivers/kernelsu -name '*.o' | wc -l)"
          echo "KernelSU object files: $count"
          test "$count" -gt 0

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-image-test
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7