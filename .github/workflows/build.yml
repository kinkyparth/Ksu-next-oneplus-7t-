name: KernelSU Next Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy

          echo "=== Verify KernelSU Next source ==="
          test -d drivers/kernelsu
          ls drivers/kernelsu | head -n 30

      - name: Configure kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 CC=clang LLVM=1 \
            vendor/sm8150-perf_defconfig

          scripts/config --enable MODULES
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --enable KSU
          scripts/config --enable KSU_MANUAL_HOOK

          make ARCH=arm64 CC=clang LLVM=1 olddefconfig

          echo "=== Kernel version ==="
          make ARCH=arm64 CC=clang LLVM=1 kernelversion

          echo "=== KernelSU hook configuration ==="
          grep -E \
            'CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK)=' \
            .config || true

          echo "=== KernelSU hook checks ==="
          grep -n -E \
            'No hooks were defined|MANUAL_HOOK|KPROBES_HOOK' \
            drivers/kernelsu/Kbuild || true

      - name: Compile kernel Image only
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          echo "=== Building arm64 kernel Image ==="

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image 2>&1 | tee ../kernel-build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo "=== KernelSU and compiler error context ==="

          if [ -f kernel-build.log ]; then
            grep -n -i -B 8 -A 12 -E \
              'drivers/kernelsu/.*(error:|fatal error:)|No hooks were defined|fatal error:|error:|undefined reference|No such file|Error [0-9]+|make(\[[0-9]+\])?: \*\*\*' \
              kernel-build.log | tail -n 180 || true

            echo "=== Final 80 lines ==="
            tail -n 80 kernel-build.log
          else
            echo "Build log not found."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify kernel Image
        if: success()
        working-directory: kernel
        run: |
          echo "=== Kernel Image ==="
          test -s arch/arm64/boot/Image
          ls -lh arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-image-test
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7