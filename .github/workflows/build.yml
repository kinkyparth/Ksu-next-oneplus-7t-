name: KernelSU Next Hook Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git \
            libelf-dev libssl-dev python3 python-is-python3

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh legacy
          test -d drivers/kernelsu

      - name: Diagnose hook configuration
        working-directory: kernel
        run: |
          echo "=== KernelSU Kconfig ==="
          sed -n '1,100p' drivers/kernelsu/Kconfig

          echo "=== KernelSU Makefile ==="
          cat drivers/kernelsu/Makefile

          echo "=== Default configuration ==="
          make ARCH=arm64 vendor/sm8150-perf_defconfig

          echo "=== Relevant Kconfig symbols ==="
          grep -R -n -E \
            'KSU_KPROBES_HOOK|KSU_MANUAL_HOOK|KSU_SYSCALL_TABLE_HOOK|config KSU' \
            drivers/kernelsu Kconfig

          echo "=== Enable base options ==="
          scripts/config --enable MODULES
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --enable KSU

          make ARCH=arm64 olddefconfig

          echo "=== Resolved hook configuration ==="
          grep -E 'KSU.*HOOK|HOOK.*KSU|CONFIG_KPROBES|CONFIG_KSU=' \
            .config || true

          echo "=== Kernel version and commit ==="
          head -n 6 Makefile
          git rev-parse HEAD