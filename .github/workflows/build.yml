
name: KernelSU Next Non-GKI Build - OnePlus 7T

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout OnePlus 7T kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Integrate KernelSU Next using legacy setup
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch next \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

          echo "=== KernelSU Next revision ==="
          git -C KernelSU-Next log -1 --oneline

          test -f KernelSU-Next/kernel/setup.sh

          bash KernelSU-Next/kernel/setup.sh legacy

          echo "=== Verify integration ==="
          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu was not created."
            echo "Review the setup script output."
            exit 1
          fi

          find drivers/kernelsu -maxdepth 2 -type f \
            -print | head -n 100

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          make ARCH=arm64 CC=clang LLVM=1 \
            vendor/sm8150-perf_defconfig

          scripts/config --enable MODULES
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --enable KSU
          scripts/config --enable KSU_KPROBE_HOOKS
          scripts/config --disable KSU_MANUAL_HOOK

          make ARCH=arm64 CC=clang LLVM=1 olddefconfig

          echo "=== Kernel version ==="
          make ARCH=arm64 CC=clang LLVM=1 kernelversion

          echo "=== Required configuration ==="
          grep -E \
            '^CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KSU|KSU_KPROBE_HOOKS)=' \
            .config || true

          echo "=== Validate configuration ==="
          for option in \
            CONFIG_KPROBES \
            CONFIG_KPROBE_EVENTS \
            CONFIG_KSU \
            CONFIG_KSU_KPROBE_HOOKS; do
            if ! grep -qx "${option}=y" .config; then
              echo "ERROR: ${option} is not enabled after olddefconfig."
              exit 1
            fi
          done

          echo "Configuration validation passed."

      - name: Diagnose syscall compatibility
        working-directory: kernel
        shell: bash
        run: |
          set +e

          echo "=== KernelSU syscall type references ==="
          grep -Rnw \
            --include='*.h' \
            --include='*.c' \
            -e 'syscall_fn_t' \
            -e 'ksu_syscall_fn_t' \
            arch/arm64 include kernel drivers/kernelsu \
            2>/dev/null | head -n 150 || true

          echo "=== Syscall hook files ==="
          find drivers/kernelsu -type f \
            \( -name '*syscall*' -o -name '*hook*' \) \
            -print 2>/dev/null | head -n 100

          echo "=== Kernel syscall table references ==="
          grep -Rnw \
            --include='*.h' \
            --include='*.c' \
            -e 'sys_call_table' \
            -e 'syscall_table' \
            arch/arm64 include kernel \
            2>/dev/null | head -n 100 || true

      - name: Compile kernel Image
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          echo "=== Building arm64 kernel Image ==="

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image 2>&1 | tee ../kernel-build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=== Workspace ==="
          pwd
          ls -lah

          if [ -f kernel-build.log ]; then
            echo "=== Relevant build errors ==="
            grep -n -i -B 8 -A 12 -E \
              'No hooks were defined|fatal error:|error:|undefined reference|No such file|Error [0-9]+|make(\[[0-9]+\])?: \*\*\*' \
              kernel-build.log | tail -n 200 || true

            echo "=== Final 100 lines ==="
            tail -n 100 kernel-build.log
          else
            echo "No compile log exists."
            echo "The failure occurred before compilation."
            echo "Inspect the first failed step above this one."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify kernel Image
        if: success()
        working-directory: kernel
        shell: bash
        run: |
          set -e
          test -s arch/arm64/boot/Image

          echo "=== Kernel Image ==="
          ls -lh arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-image-test
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7
