
name: RKSU Non-GKI Build - OnePlus 7T HD1901

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Base defconfig"
        required: true
        default: "vendor/sm8150-perf_defconfig"
      fragments:
        description: "Additional config fragments, space-separated"
        required: false
        default: "vendor/oplus.config"

permissions:
  contents: read

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KSU_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout OnePlus 7T kernel
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Verify target and source files
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Kernel source revision ==="
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "67c05b4545d98112870150d6f6dcc1a3f29fa47b"

          echo "=== Target configuration ==="
          test -f arch/arm64/configs/vendor/sm8150-perf_defconfig
          test -f drivers/media/platform/msm/camera/cam_utils/cam_trace.h
          test -f drivers/power/oplus/charger_ic/oplus_da9313.c

          echo "=== DA9313 header search ==="
          find drivers -name 'oplus_da9313.h' -print

          HEADER="$(find drivers -name 'oplus_da9313.h' -print -quit)"
          if [ -z "$HEADER" ]; then
            echo "ERROR: oplus_da9313.h is absent from the checked-out source."
            exit 1
          fi

          echo "Found header: $HEADER"

      - name: Integrate RKSU
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          curl -fLSs \
            "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          test -s /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "$KSU_BRANCH"

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'kernelsu' drivers/Kconfig

          echo "=== RKSU Kconfig options ==="
          grep -rhE '^config ' drivers/kernelsu/ --include=Kconfig

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        env:
          BASE_DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_FRAGMENTS: ${{ inputs.fragments }}
        run: |
          set -euxo pipefail

          MAKE_ARGS="ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          base="${BASE_DEFCONFIG:-vendor/sm8150-perf_defconfig}"
          fragments="${EXTRA_FRAGMENTS:-vendor/oplus.config}"

          test -f "arch/arm64/configs/$base"
          make $MAKE_ARGS "$base"

          for fragment in $fragments; do
            test -f "arch/arm64/configs/$fragment"
            ARCH=arm64 scripts/kconfig/merge_config.sh \
              -m .config "arch/arm64/configs/$fragment"
          done

          options="$(grep -rhE '^config ' drivers/kernelsu/ --include=Kconfig | awk '{print $2}')"

          scripts/config --enable KSU

          if echo "$options" | grep -qx KSU_MANUAL_HOOK; then
            scripts/config --enable KSU_MANUAL_HOOK
          elif echo "$options" | grep -qx KSU_KPROBE_HOOKS; then
            scripts/config --enable KPROBES
            scripts/config --enable KPROBE_EVENTS
            scripts/config --enable KSU_KPROBE_HOOKS
          else
            echo "ERROR: This RKSU revision exposes neither expected hook option."
            echo "$options"
            exit 1
          fi

          make $MAKE_ARGS olddefconfig

          echo "=== Final RKSU configuration ==="
          grep -E '^CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU[A-Z_]*)=' .config || true
          grep -qx 'CONFIG_KSU=y' .config

      - name: Fix camera trace-header include path
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          DIR="drivers/media/platform/msm/camera/cam_utils"
          FILE="$DIR/Makefile"

          test -f "$DIR/cam_trace.c"
          test -f "$DIR/cam_trace.h"

          if [ ! -f "$FILE" ]; then
            touch "$FILE"
          fi

          if ! grep -qF '# TRACEFIX' "$FILE"; then
            cat >> "$FILE" <<'EOF'

          # TRACEFIX
          ccflags-y += -I$(srctree)/$(src) -I$(src)
          EOF
          fi

          echo "=== Trace include settings ==="
          grep -n 'TRACE_INCLUDE_PATH\|TRACE_INCLUDE_FILE' "$DIR/cam_trace.h" || true
          tail -n 5 "$FILE"

      - name: Fix DA9313 header include path
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE="drivers/power/oplus/charger_ic/oplus_da9313.c"
          DIR="drivers/power/oplus/charger_ic"
          FILE="$DIR/Makefile"

          HEADER="$(find drivers -name 'oplus_da9313.h' -print -quit)"
          if [ -z "$HEADER" ]; then
            echo "ERROR: oplus_da9313.h is missing."
            exit 1
          fi

          HEADER_DIR="$(dirname "$HEADER")"
          echo "Header path: $HEADER"

          if [ "$HEADER_DIR" != "$DIR" ]; then
            if [ ! -f "$FILE" ]; then
              touch "$FILE"
            fi

            INCLUDE_LINE="ccflags-y += -I\$(srctree)/$HEADER_DIR"

            if ! grep -qF "$INCLUDE_LINE" "$FILE"; then
              printf '\n%s\n' "$INCLUDE_LINE" >> "$FILE"
            fi
          fi

          echo "=== DA9313 source include ==="
          sed -n '65,76p' "$SOURCE"
          echo "=== DA9313 Makefile ==="
          cat "$FILE"

      - name: Compile kernel Image
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          MAKE_ARGS="ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          make -j"$(nproc)" $MAKE_ARGS \
            KCFLAGS="-Wno-error" \
            Image 2>&1 | tee ../kernel-build.log

      - name: Show first build errors
        if: failure()
        shell: bash
        run: |
          set +e

          if [ -f kernel-build.log ]; then
            echo "=== First compiler error ==="
            grep -n -m1 -B 10 -A 20 -E \
              'fatal error:|error:|undefined reference|No such file' \
              kernel-build.log

            echo "=== Error summary ==="
            grep -n -E \
              'fatal error:|error:|undefined reference|\*\*\*' \
              kernel-build.log | head -n 100

            echo "=== Final 60 lines ==="
            tail -n 60 kernel-build.log
          else
            echo "No kernel-build.log; inspect the failed step above."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify kernel Image
        if: success()
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="arch/arm64/boot/Image"
          test -s "$IMAGE"

          echo "=== Built Image ==="
          ls -lh "$IMAGE"
          sha256sum "$IMAGE"

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-image-test
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7
