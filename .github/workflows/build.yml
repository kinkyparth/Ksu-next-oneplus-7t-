
name: KernelSU Next Kprobes - OnePlus 7T

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git curl \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Integrate KernelSU Next legacy with kprobes
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh legacy

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'kernelsu' drivers/Kconfig

          echo "=== KernelSU source revision ==="
          if [ -d KernelSU-Next/.git ]; then
            git -C KernelSU-Next log -1 --oneline
          fi

          echo "=== Verify expected kprobe option ==="
          grep -Rnw drivers/kernelsu \
            --include='Kconfig' \
            -e 'KSU_KPROBE_HOOKS'

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          MAKE_ARGS="ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          make $MAKE_ARGS vendor/sm8150-perf_defconfig

          scripts/config --enable MODULES
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --enable KSU
          scripts/config --enable KSU_KPROBE_HOOKS

          make $MAKE_ARGS olddefconfig

          echo "=== Validate final config ==="
          for option in \
            CONFIG_MODULES \
            CONFIG_KPROBES \
            CONFIG_KPROBE_EVENTS \
            CONFIG_KSU \
            CONFIG_KSU_KPROBE_HOOKS; do
            if ! grep -qx "${option}=y" .config; then
              echo "ERROR: $option is not enabled after olddefconfig"
              exit 1
            fi
          done

          grep -E '^CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KSU|KSU_KPROBE_HOOKS)=' .config

      - name: Build kernel Image
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image 2>&1 | tee ../kernel-build.log

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          if [ -f kernel-build.log ]; then
            grep -n -i -B 10 -A 15 -E \
              'error:|fatal error:|No hooks were defined|undefined reference|No such file|Error [0-9]+|make(\[[0-9]+\])?: \*\*\*' \
              kernel-build.log | tail -n 250 || true
            tail -n 100 kernel-build.log
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Image
        if: success()
        working-directory: kernel
        run: |
          set -eux
          test -s arch/arm64/boot/Image
          ls -lh arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-image
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7
