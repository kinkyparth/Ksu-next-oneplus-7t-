name: RKSU Kernel Build - OnePlus 7T

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      KERNEL_REPO: https://github.com/Evolution-X-Devices/kernel_oneplus_sm8150.git
      KERNEL_COMMIT: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
      KSU_BRANCH: main
      ARCH: arm64
      SUBARCH: arm64

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates \
            clang clang-14 lld llvm \
            cpio curl flex git libelf-dev \
            libssl-dev make pahole python3 \
            rsync unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Checkout kernel source
        run: |
          git clone "$KERNEL_REPO" kernel
          cd kernel
          git checkout "$KERNEL_COMMIT"
          git rev-parse HEAD

      - name: Integrate RKSU
        working-directory: kernel
        run: |
          set -e

          curl -fLSs \
            "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          bash /tmp/ksu-setup.sh "$KSU_BRANCH"

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: RKSU directory was not created."
            exit 1
          fi

          echo "RKSU integration directory:"
          ls drivers/kernelsu

      - name: Download manual-hook patch
        run: |
          set -e

          curl -fLSs \
            "https://raw.githubusercontent.com/rksuorg/kernel_patches/master/manual_hook/kernel-4.14.patch" \
            -o "$RUNNER_TEMP/manual_hook.patch"

          test -s "$RUNNER_TEMP/manual_hook.patch"
          head -n 5 "$RUNNER_TEMP/manual_hook.patch"

      - name: Check and apply manual-hook patch
        working-directory: kernel
        run: |
          set -e

          git apply --stat "$RUNNER_TEMP/manual_hook.patch"
          git apply --check "$RUNNER_TEMP/manual_hook.patch"
          git apply "$RUNNER_TEMP/manual_hook.patch"

          echo "Manual-hook patch applied."

      - name: Verify hook declarations
        working-directory: kernel
        run: |
          set -e

          grep -n 'ksu_input_hook' drivers/input/input.c
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c
          grep -n 'ksu_handle_vfs_read' fs/read_write.c
          grep -n 'ksu_handle_stat' fs/stat.c
          grep -n 'ksu_handle_sys_reboot' kernel/reboot.c

      - name: Stub oplus_set_opluschg_pd_sdp (charger driver not usable on this tree)
        working-directory: kernel
        run: |
          python3 - << 'PYEOF'
          import re, subprocess, sys

          sym = "oplus_set_opluschg_pd_sdp"
          cands = ["drivers/usb/pd/policy_engine.c"] + subprocess.run(
              ["bash", "-c", f"grep -rlE '{sym}' include drivers/usb drivers/power --include='*.h' 2>/dev/null"],
              capture_output=True, text=True).stdout.split()

          pat = re.compile(
              r'^[ \t]*(?:extern[ \t]+)?((?:void|int|bool|long|unsigned[ \t\w]*|u\d+|s\d+)[ \t]+\**[ \t]*'
              + sym + r'[ \t]*\([^;{]*\))[ \t]*;', re.M)

          proto = None
          for f in cands:
              m = pat.search(open(f).read())
              if m:
                  proto = " ".join(m.group(1).split())
                  print("Found declaration in", f, ":", proto)
                  break

          if not proto:
              print("ERROR: could not find a declaration of", sym)
              subprocess.run(["grep", "-rn", sym, "drivers/usb/pd", "include"])
              sys.exit(1)

          # Give unnamed parameters a name (C needs one in a function definition)
          head, params = proto.split("(", 1)
          params = params.rsplit(")", 1)[0].strip()
          if params and params != "void":
              fixed = []
              for i, p in enumerate(x.strip() for x in params.split(",")):
                  toks = p.replace("*", " * ").split()
                  basic = {"bool", "int", "long", "char", "short", "unsigned", "signed", "u8", "u16", "u32", "u64", "s8", "s16", "s32", "s64"}
                  if len(toks) == 1 or toks[-1] == "*" or (toks[-1] in basic):
                      p = p + " _a" + str(i)
                  fixed.append(p)
              proto = head + "(" + ", ".join(fixed) + ")"
          print("Stub prototype:", proto)

          body = "{ }" if proto.startswith("void") else "{ return 0; }"
          with open("drivers/usb/pd/policy_engine.c", "a") as fh:
              fh.write("\n/* RKSU CI stub: real implementation lives in the OPLUS charger driver */\n")
              fh.write("__weak " + proto + " " + body + "\n")
          print("Stub appended.")
          PYEOF
          tail -n 4 drivers/usb/pd/policy_engine.c

      - name: Compute extra include paths (Clang fix, all MSM dirs)
        working-directory: kernel
        run: |
          set -e

          # -idirafter = fallback only, so each driver's own Makefile -I paths still win
          roots="drivers/platform/msm drivers/media/platform/msm drivers/soc/qcom drivers/misc drivers/input drivers/char drivers/power"

          {
            # Parent dir of every subdir (fixes "subdir/x.h includes ../x.h" cases, e.g. ipa_v3/dump)
            for d in $(find $roots -mindepth 1 -type d 2>/dev/null); do
              p=$(dirname "$d")
              if ls "$p"/*.h >/dev/null 2>&1; then echo "$PWD/$p"; fi
            done
            # Camera tracepoint headers only (fixes cam_trace.h)
            find drivers/media/platform/msm/camera -name '*_trace.h' -printf '%h\n' 2>/dev/null | sed "s|^|$PWD/|"
          } | sort -u > /tmp/inc_dirs.txt

          wc -l /tmp/inc_dirs.txt
          echo "EXTRA_INC=$(sed 's/^/-idirafter /' /tmp/inc_dirs.txt | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/sm8150-perf_defconfig

          # Ensure RKSU is enabled.
          if ! grep -rqE '^[[:space:]]*config KSU([[:space:]]|$)' \
            drivers/kernelsu --include='Kconfig*'; then
            echo "ERROR: RKSU Kconfig entry not found."
            exit 1
          fi

          scripts/config --enable KSU

          # OPLUS core drivers gated off in the defconfig (found via linker diagnostics)
          for c in OPLUS_SYSTEM_KERNEL OPLUS_COMMON_SOFT OPLUS_FEATURE_PROJECTINFO OPLUS_DEVICE_IFNO OPLUS_FEATURE_OPROJECT OPLUS_FEATURE_QCOM_PMICWD OPLUS_FINGERPRINT TOUCHPANEL_OPLUS QPNP_SMB2; do
            scripts/config --enable "$c"
          done

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          if ! grep -qx 'CONFIG_KSU=y' .config; then
            echo "ERROR: CONFIG_KSU=y is not enabled."
            exit 1
          fi

          echo "OPLUS option status after olddefconfig:"
          for c in OPLUS_SYSTEM_KERNEL OPLUS_COMMON_SOFT OPLUS_FEATURE_PROJECTINFO OPLUS_DEVICE_IFNO OPLUS_FEATURE_OPROJECT OPLUS_FEATURE_QCOM_PMICWD OPLUS_FINGERPRINT TOUCHPANEL_OPLUS QPNP_SMB2; do
            grep -E "^(# )?CONFIG_$c[= ]" .config || echo "CONFIG_$c missing from .config (dependency not met?)"
          done

          # Any gate that is not a real Kconfig symbol gets passed to make directly
          extra=""
          for c in OPLUS_FEATURE_QCOM_PMICWD; do
            grep -qx "CONFIG_$c=y" .config || extra="$extra CONFIG_$c=y"
          done
          echo "EXTRA_MAKE_VARS=$extra" >> "$GITHUB_ENV"
          echo "Extra make vars:$extra"

          echo "RKSU configuration enabled."
          grep -E '^CONFIG_KSU' .config || true

      - name: Build kernel Image
        working-directory: kernel
        run: |
          set -o pipefail

          make -k -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang-14 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error $EXTRA_INC" \
            $EXTRA_MAKE_VARS \
            Image 2>&1 | tee build.log

      - name: Diagnose missing symbols
        if: failure()
        working-directory: kernel
        run: |
          # Also write diagnostics into build.log so they ship in the uploaded artifact
          exec > >(tee -a build.log) 2>&1

          # For each linker "undefined symbol", find who defines it and which CONFIG gates it
          for sym in $(grep -oP 'undefined symbol: \K\S+' build.log | sort -u); do
            echo "=== $sym"
            grep -rlE "EXPORT_SYMBOL(_GPL)?\($sym\)|^[A-Za-z_][A-Za-z0-9_ \*]*[ \*]$sym\(" \
              --include='*.c' drivers kernel techpack arch fs 2>/dev/null | head -2 |
            while read -r f; do
              echo "defined in: $f"
              d=$(dirname "$f"); o=$(basename "$f" .c)
              grep -hE "$o\.o|$o/" "$d/Makefile" 2>/dev/null | head -2
              # Walk up: which parent Makefile line pulls in this folder, and is its CONFIG on?
              p="$d"
              for i in 1 2 3 4; do
                b=$(basename "$p"); p=$(dirname "$p")
                line=$(grep -hE "[ =+]$b/" "$p/Makefile" 2>/dev/null | head -1)
                if [ -n "$line" ]; then
                  echo "parent gate ($p/Makefile): $line"
                  for c in $(echo "$line" | grep -oE 'CONFIG_[A-Z0-9_]+' | sort -u); do
                    grep -E "^(# )?$c[= ]" .config || echo "$c not in .config"
                  done
                fi
              done
              for c in $(grep -hE "$o\.o|$o/" "$d/Makefile" 2>/dev/null | grep -oE 'CONFIG_[A-Z0-9_]+' | sort -u); do
                grep -E "^(# )?$c[= ]" .config || echo "$c not in .config"
              done
            done
          done
          sleep 2

      - name: Summarize all errors
        if: always()
        working-directory: kernel
        run: |
          grep -nE "fatal error|error:|undefined reference" build.log | sort -u | head -80 || true

      - name: Verify Image
        if: always()
        working-directory: kernel
        run: |
          if [ -f arch/arm64/boot/Image ]; then
            ls -lh arch/arm64/boot/Image
            sha256sum arch/arm64/boot/Image
            file arch/arm64/boot/Image
          else
            echo "Image not found. Check the build log."
          fi

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RKSU-OnePlus-7T-Image
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RKSU-build-log
          path: kernel/build.log
          if-no-files-found: ignore