
name: RKSU Manual Hook Build - OnePlus 7T

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Base defconfig under arch/arm64/configs"
        required: false
        default: "vendor/sm8150-perf_defconfig"
      fragments:
        description: "Extra config fragments, space separated"
        required: false
        default: "vendor/oplus.config"

permissions:
  contents: read

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KSU_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Evolution X kernel
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Integrate RKSU and apply manual hooks
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking RKSU branch..."
          git ls-remote --exit-code \
            https://github.com/rsuntk/KernelSU.git \
            "refs/heads/${KSU_BRANCH}"

          echo "Downloading RKSU setup script..."
          curl -fLSs \
            "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh

          test -s /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "${KSU_BRANCH}"

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          echo "Checking installed RKSU configuration..."
          grep -q kernelsu drivers/Makefile
          grep -q kernelsu drivers/Kconfig
          grep -rhE '^config ' drivers/kernelsu/ --include=Kconfig

          echo "Downloading RKSU manual-hook patch..."
          curl -fLSs \
            "https://github.com/rsuntk/KernelSU/commit/71e74cfc0a96f2a0aec891f440fcc8735a1ca302.patch" \
            -o /tmp/rksu-manual-hooks.patch

          test -s /tmp/rksu-manual-hooks.patch

          echo "Checking patch compatibility before applying..."
          git apply --check /tmp/rksu-manual-hooks.patch

          git apply /tmp/rksu-manual-hooks.patch

          echo "Verifying manual hooks..."
          grep -n 'ksu_handle_execveat' fs/exec.c
          grep -n 'ksu_handle_faccessat' fs/open.c
          grep -n 'ksu_handle_vfs_read' fs/read_write.c
          grep -n 'ksu_handle_stat' fs/stat.c
          grep -n 'ksu_handle_sys_reboot' kernel/reboot.c
          grep -n 'ksu_handle_input_handle_event' drivers/input/input.c

          echo "RKSU manual-hook patch applied."

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        env:
          BASE_DEFCONFIG: ${{ inputs.defconfig }}
          EXTRA_FRAGMENTS: ${{ inputs.fragments }}
        run: |
          set -euxo pipefail

          MAKE_ARGS="ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          base="${BASE_DEFCONFIG:-vendor/sm8150-perf_defconfig}"
          frags="${EXTRA_FRAGMENTS:-vendor/oplus.config}"

          test -f "arch/arm64/configs/$base"
          make $MAKE_ARGS "$base"

          for f in $frags; do
            test -f "arch/arm64/configs/$f"
            ARCH=arm64 scripts/kconfig/merge_config.sh \
              -m .config "arch/arm64/configs/$f"
          done

          echo "Checking RKSU Kconfig symbols..."
          grep -rhE '^config KSU([_A-Z0-9]*)?' \
            drivers/kernelsu --include=Kconfig || true

          if ! grep -rqE '^config KSU_MANUAL_HOOK([[:space:]]|$)' \
              drivers/kernelsu --include=Kconfig; then
            echo "ERROR: This RKSU revision does not define KSU_MANUAL_HOOK."
            echo "Refusing to guess the manual-hook configuration symbol."
            exit 1
          fi

          scripts/config --enable KSU
          scripts/config --enable KSU_MANUAL_HOOK

          # Manual hooks are used, so Kprobe hooks are not requested.
          scripts/config --disable KSU_KPROBE_HOOKS

          make $MAKE_ARGS olddefconfig

          grep -qx 'CONFIG_KSU=y' .config
          grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' .config

          echo "Verified RKSU configuration:"
          grep -E '^CONFIG_KSU([_=]|_)' .config || true

      - name: Fix trace header include paths
        working-directory: kernel
        shell: bash
        run: |
          set -uo pipefail

          patch_mk() {
            dir="$1"
            mk=""

            for cand in "$dir/Kbuild" "$dir/Makefile"; do
              if [ -f "$cand" ]; then
                mk="$cand"
                break
              fi
            done

            [ -n "$mk" ] || return 0
            grep -qF TRACEFIX "$mk" && return 0

            printf '\n# TRACEFIX\nccflags-y += -I$(srctree)/$(src) -I$(src)\n' \
              >> "$mk"
          }

          patch_mk drivers/media/platform/msm/camera/cam_utils

          while read -r hdr; do
            patch_mk "$(dirname "$hdr")"
          done < <(
            grep -rlE 'define[[:space:]]+TRACE_INCLUDE_PATH[[:space:]]+.' \
              --include='*.h' . 2>/dev/null || true
          )

      - name: Fix Oplus header includes
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ -d drivers/power/oplus ]; then
            find drivers/power/oplus \
              \( -name '*.c' -o -name '*.h' \) -print0 |
              xargs -0 -r sed -i \
                's/#include <\(oplus_[^>]*\.h\)>/#include "\1"/g'
          fi

          echo "Oplus include patch completed."

      - name: Compile kernel Image
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error" \
            Image 2>&1 | tee ../kernel-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify kernel Image
        if: success()
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          test -s arch/arm64/boot/Image

          echo "Built kernel:"
          ls -lh arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image

          count="$(find -L drivers/kernelsu -name '*.o' | wc -l)"
          echo "RKSU object files: $count"
          test "$count" -gt 0

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-rksu-image-test
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7
