
name: KernelSU Next v3.2.0 Legacy Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout OnePlus 7T kernel source
        uses: actions/checkout@v4
        with:
          repository: Evolution-X-Devices/kernel_oneplus_sm8150
          ref: 67c05b4545d98112870150d6f6dcc1a3f29fa47b
          path: kernel
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libelf-dev libssl-dev python3 python-is-python3 \
            rsync clang lld llvm gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download KernelSU Next legacy source
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch v3.2.0-legacy \
            https://github.com/KernelSU-Next/KernelSU-Next.git \
            KernelSU-Next

          echo "=== KernelSU tag ==="
          git -C KernelSU-Next describe --tags --exact-match

          test "$(git -C KernelSU-Next describe --tags --exact-match)" \
            = "v3.2.0-legacy"

          echo "=== KernelSU setup script ==="
          test -f KernelSU-Next/kernel/setup.sh
          sed -n '1,220p' KernelSU-Next/kernel/setup.sh

      - name: Integrate KernelSU Next
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          bash KernelSU-Next/kernel/setup.sh legacy

          echo "=== Integration result ==="
          find . -maxdepth 5 \
            \( -iname '*kernelsu*' -o -iname '*ksu*' \) \
            -print | head -n 150

          if [ ! -d drivers/kernelsu ]; then
            echo "ERROR: drivers/kernelsu was not created."
            echo "Inspect the setup script output and directory layout."
            exit 1
          fi

          echo "=== KernelSU files ==="
          find drivers/kernelsu -maxdepth 3 -type f \
            -print | head -n 150

      - name: Diagnose syscall type compatibility
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          set +e

          echo "=== Kernel checkout ==="
          pwd
          ls -lah

          echo "=== KernelSU directories ==="
          find . -maxdepth 5 -type d \
            \( -iname '*kernelsu*' -o -iname '*ksu*' \) \
            -print 2>/dev/null | head -n 150

          echo "=== Syscall hook files ==="
          find . -type f \
            \( -name 'syscall_hook.h' -o -name '*syscall*hook*' \) \
            -print 2>/dev/null | head -n 100

          echo "=== syscall_fn_t references ==="
          grep -Rnw \
            --include='*.h' --include='*.c' \
            -e 'syscall_fn_t' -e 'ksu_syscall_fn_t' \
            arch/arm64 include kernel drivers 2>/dev/null \
            | head -n 150 || true

          echo "=== Kernel syscall table references ==="
          grep -Rnw \
            --include='*.h' --include='*.c' \
            -e 'sys_call_table' -e 'syscall_table' \
            arch/arm64 include kernel 2>/dev/null \
            | head -n 100 || true

      - name: Configure kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euxo pipefail

          test -d drivers/kernelsu

          make ARCH=arm64 CC=clang LLVM=1 \
            vendor/sm8150-perf_defconfig

          scripts/config --enable MODULES
          scripts/config --enable KPROBES
          scripts/config --enable KPROBE_EVENTS
          scripts/config --enable KSU
          scripts/config --disable KSU_MANUAL_HOOK
          scripts/config --enable KSU_KPROBES_HOOK

          make ARCH=arm64 CC=clang LLVM=1 olddefconfig

          echo "=== Kernel version ==="
          make ARCH=arm64 CC=clang LLVM=1 kernelversion

          echo "=== KernelSU configuration ==="
          grep -E \
            'CONFIG_(MODULES|KPROBES|KPROBE_EVENTS|KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK)=' \
            .config || true

          echo "=== Available hook options ==="
          grep -n -E \
            'KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_KPROBES' \
            drivers/kernelsu/Kconfig drivers/kernelsu/Kbuild || true

      - name: Compile kernel Image
        working-directory: kernel
        shell: bash
        run: |
          set -o pipefail

          echo "=== Building arm64 kernel Image ==="

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image 2>&1 | tee ../kernel-build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          set +e

          echo "=== Workspace ==="
          pwd
          ls -lah

          echo "=== Find logs ==="
          find . -maxdepth 5 -type f \
            \( -name 'kernel-build.log' -o -name '*.log' \) \
            -print 2>/dev/null | head -n 100

          for LOG in kernel-build.log kernel/kernel-build.log; do
            if [ -f "$LOG" ]; then
              echo "=== Relevant errors from $LOG ==="
              grep -n -i -B 8 -A 12 -E \
                'No hooks were defined|fatal error:|error:|undefined reference|No such file|Error [0-9]+|make(\[[0-9]+\])?: \*\*\*' \
                "$LOG" | tail -n 200 || true
              echo "=== Final 100 lines ==="
              tail -n 100 "$LOG"
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-v3.2.0-legacy-build-log
          path: kernel-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify kernel Image
        if: success()
        working-directory: kernel
        shell: bash
        run: |
          set -e
          test -s arch/arm64/boot/Image

          echo "=== Kernel Image ==="
          ls -lh arch/arm64/boot/Image
          sha256sum arch/arm64/boot/Image

      - name: Upload kernel Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hotdogb-kernelsu-v3.2.0-legacy-image-test
          path: kernel/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7
